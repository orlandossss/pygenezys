[project]
name = "pygenezys"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dorian Lamouille", email = "dorianlamouille@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.2",
]
examples = [
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

